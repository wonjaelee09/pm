<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Career AI Transition Tracker</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--accent:#38bdf8;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--line:#273449}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:24px;max-width:1100px;margin:auto}h1{margin:0 0 6px;font-size:28px}p{margin:0;color:var(--muted)}
    main{max-width:1100px;margin:auto;padding:0 24px 40px;display:grid;gap:18px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.metric{font-size:24px;font-weight:700}.label{color:var(--muted);font-size:13px}.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.col h2{font-size:16px;margin:0 0 10px}.task{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#0b1220}.task small{color:var(--muted)}
    table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:14px}th{color:var(--muted);font-weight:600}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}
    textarea,input,select,button{width:100%;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--text);padding:10px}button{cursor:pointer;background:var(--accent);color:#00111c;font-weight:700;border:0}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.hint{font-size:13px;color:var(--muted)}
    @media(max-width:800px){.grid,.cols,.row{grid-template-columns:1fr}header,main{padding-left:14px;padding-right:14px}}
  </style>
</head>
<body>
<header><h1>Career AI Transition Tracker</h1><p>Snowflake + AI/data platform + LLM eval accountability dashboard</p></header>
<main>
  <section class="grid" id="metrics"></section>
  <section class="card"><h2>Weekly scoreboard</h2><table id="scoreboard"></table></section>
  <section class="cols">
    <div class="card col"><h2>Backlog</h2><div id="backlog"></div></div>
    <div class="card col"><h2>In progress</h2><div id="progress"></div></div>
    <div class="card col"><h2>Done</h2><div id="done"></div></div>
  </section>
  <section class="card"><h2>Check-in input</h2><p class="hint">Use this during weekly Discord check-ins. Data stays in your browser localStorage unless you export/paste it.</p><div class="row"><input id="snow" placeholder="Snowflake hrs"><input id="proj" placeholder="AI/data project hrs"><input id="eval" placeholder="LLM eval hrs"><input id="comm" placeholder="Communication hrs"><input id="ml" placeholder="ML/stats hrs"></div><br><textarea id="notes" rows="5" placeholder="Completed / blocked / next deliverable"></textarea><br><br><button onclick="saveCheckin()">Save local check-in</button><pre id="export" class="hint"></pre></section>
</main>
<script>
const data={targets:{project:3,snow:2,eval:1.5,comm:1,ml:.5,total:8},weeks:[{week:'2026-07-27',project:null,snow:null,eval:null,comm:null,ml:null,total:null,score:'',notes:'Initial setup'}],tasks:{backlog:['Build SnowPro Core study tracker','Review Snowflake architecture, warehouses, storage vs compute','Review RBAC, data sharing, Time Travel, Fail-safe','Review Snowpipe, streams/tasks, semi-structured data','Take first timed SnowPro practice test','Define first role-targeted project scope','Build Snowflake/data quality or lineage mini-project','Add README with business problem, architecture, validation','Create one architecture diagram','Read OpenAI evals guide','Read Anthropic evals article','Design Banking/Data Analyst Copilot Eval Harness','Create first rubric-based eval dataset','Track cost/latency/factuality in a simple report','Create 5-minute career narrative','Create 5-minute demo script for one project','Convert one project into resume bullets','Draft promotion narrative around AI/data enablement impact','Review train/test split and overfitting','Review precision/recall and ROC/AUC','Review confidence intervals and A/B testing basics'],progress:['Weekly accountability system setup'],done:['Create career scoreboard','Create career transition Kanban','Create tracker app']}};
function metric(label,val){return `<div class="card"><div class="metric">${val}</div><div class="label">${label}</div></div>`}
function render(){metrics.innerHTML=metric('Weekly target','8 hrs')+metric('AI/data project','3 hrs')+metric('Snowflake','2 hrs')+metric('LLM eval','1.5 hrs')+metric('Communication','1 hr');scoreboard.innerHTML='<tr><th>Week</th><th>Project</th><th>Snowflake</th><th>Eval</th><th>Comm</th><th>ML</th><th>Total</th><th>Score</th><th>Notes</th></tr>'+data.weeks.map(w=>`<tr><td>${w.week}</td><td>${w.project??''}</td><td>${w.snow??''}</td><td>${w.eval??''}</td><td>${w.comm??''}</td><td>${w.ml??''}</td><td>${w.total??''}</td><td>${w.score}</td><td>${w.notes}</td></tr>`).join('');for(const k of ['backlog','progress','done']){document.getElementById(k).innerHTML=data.tasks[k].map(t=>`<div class="task">${t}</div>`).join('')}}
function saveCheckin(){const vals={snow:snow.value,project:proj.value,eval:eval.value,comm:comm.value,ml:ml.value,notes:notes.value};localStorage.setItem('career-checkin',JSON.stringify(vals));export.textContent='Paste this to Hermes:\n'+JSON.stringify(vals,null,2)}
render();
</script>
</body></html>
